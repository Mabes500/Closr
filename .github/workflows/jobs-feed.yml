# Jobs feed (roadmap 6.2a, closr/docs/JOBS-FEED-PLAN.md section 3).
# Every 3 hours, reads every employer job board in Supabase's job_boards table, saves
# what's new or changed to job_postings, then enriches and matches. Run it by hand from the
# Actions tab: "Jobs feed" → "Run workflow". Supabase Cron starts it on time (see
# supabase/migrations/20261110000000_feed_schedule.sql); GitHub's schedule here can run late
# and is the backup. A second run finds nothing new, so overlap is harmless.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL               the Supabase Project URL (same value as VITE_SUPABASE_URL)
#   SUPABASE_SERVICE_ROLE_KEY  Supabase → Project Settings → API Keys → secret key
#   ANTHROPIC_API_KEY          console.anthropic.com → API Keys (optional: enrichment's
#                              AI step is skipped without it)
# These keys live only here, never in the app.

name: Jobs feed

on:
  schedule:
    - cron: '30 */3 * * *' # every 3 hours
  workflow_dispatch:
    inputs:
      load_seed:
        description: 'Load the starter list first (closr/scripts/jobs/seed-boards.csv)'
        type: boolean
        default: false
      dry_run:
        description: 'Dry run: read the boards and count, but save nothing'
        type: boolean
        default: false
      limit:
        description: 'Only read this many boards (leave empty for all)'
        type: string
        default: ''
      cost_cap:
        description: 'Most to spend on AI enrichment this run, in US dollars'
        type: string
        default: '1'

# Never two runs at once.
concurrency:
  group: jobs-feed
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: closr
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      LIMIT: ${{ inputs.limit }}
      # Enrichment (6.2b). Without the key, the AI part is skipped and only rules run.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ENRICH_COST_CAP_USD: ${{ inputs.cost_cap || '1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: closr/package-lock.json

      # Only the runtime packages (the scripts need @supabase/supabase-js); skip install scripts.
      - run: npm ci --omit=dev --ignore-scripts

      - name: Load the starter list
        if: ${{ inputs.load_seed && inputs.dry_run != true }}
        run: node scripts/jobs/load-seed.ts

      - name: Read job boards
        id: read
        run: node scripts/jobs/run.ts

      # If some boards couldn't be saved, people should still get matches from the rest.
      # The run still shows red, so the problem gets noticed.
      - name: Enrich new postings
        if: ${{ !cancelled() && (steps.read.outcome == 'success' || steps.read.outcome == 'failure') }}
        run: node scripts/jobs/enrich.ts

      - name: Match postings to people
        if: ${{ !cancelled() && (steps.read.outcome == 'success' || steps.read.outcome == 'failure') }}
        run: node scripts/jobs/match.ts
