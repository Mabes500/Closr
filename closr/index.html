    <meta property="og:title" content="Closr: apply widely, stay on top of it" />

    <title>Closr</title>
    <script>
      // Apply the saved appearance before first paint (see src/lib/theme.ts).
      try {
        var t = localStorage.getItem('closr-theme')
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
