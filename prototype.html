:root{
/* Oxford Blue — primary brand ink */
--oxford-950:#00152E;--oxford-900:#002147;--oxford-800:#0E3360;--oxford-700:#234A7A;--oxford-600:#3E6596;--oxford-500:#6683AF;--oxford-300:#A9BAD4;--oxford-200:#CDD7E7;--oxford-100:#E6ECF5;--oxford-50:#F3F6FA;
/* Closr Blue — the ring in the mark */
--blue-800:#16297F;--blue-700:#1A35A8;--blue-600:#2346D9;--blue-500:#4A66E8;--blue-400:#7D95FF;--blue-200:#C4CFFF;--blue-100:#E3E8FF;--blue-50:#F1F4FF;
/* Spark Gold — the dot in the mark */
--gold-800:#7A5200;--gold-700:#A86F00;--gold-600:#C98A00;--gold-500:#E9A100;--gold-400:#F2B632;--gold-200:#FBE2A6;--gold-100:#FDF1D3;--gold-50:#FFF9EB;
/* Ink — text (wordmark ink #131A2C) */
--ink-900:#131A2C;--ink-800:#252D42;--ink-700:#3A4258;--ink-600:#535B70;--ink-500:#6B7184;--ink-400:#8D92A2;--ink-300:#B4B8C4;
/* Paper — warm neutral surfaces */
--paper-0:#FFFFFF;--paper-50:#FBF8F3;--paper-100:#F5F0E8;--paper-200:#ECE5DA;--paper-300:#DDD4C6;--paper-400:#C4B9A8;
/* Feedback */
--mint-700:#137451;--mint-600:#1F9D6B;--mint-400:#5CC79A;--mint-100:#DDF4EA;
--coral-700:#B23A22;--coral-600:#D9502F;--coral-400:#F08A6E;--coral-100:#FCE7E0;
--lilac-700:#5B3FB0;--lilac-500:#8B6FE0;--lilac-100:#EEE8FD;

/* Semantic aliases */
--text-strong:var(--ink-900);--text-body:var(--ink-700);--text-muted:var(--ink-500);--text-subtle:var(--ink-400);--text-on-brand:#FFFFFF;--text-link:var(--blue-600);--text-brand:var(--oxford-900);
--surface-page:var(--paper-50);--surface-card:var(--paper-0);--surface-sunken:var(--paper-100);--surface-hover:var(--paper-100);--surface-brand:var(--oxford-900);--surface-brand-soft:var(--oxford-50);--surface-accent:var(--blue-600);--surface-accent-soft:var(--blue-50);--surface-spark:var(--gold-500);--surface-spark-soft:var(--gold-50);--surface-overlay:rgba(0,21,46,.42);
--border-subtle:var(--paper-200);--border-default:var(--paper-300);--border-strong:var(--ink-300);--border-focus:var(--blue-500);
--action-primary:var(--oxford-900);--action-primary-fg:#FFFFFF;--action-accent-fg:#FFFFFF;--surface-inverse:var(--oxford-900);--text-inverse:#FFFFFF;--text-on-spark:#131A2C;--action-primary-hover:var(--oxford-800);--action-primary-press:var(--oxford-950);
--action-accent:var(--blue-600);--action-accent-hover:var(--blue-700);
--success-fg:var(--mint-700);--success-bg:var(--mint-100);--success-solid:var(--mint-600);
--warning-fg:var(--gold-800);--warning-bg:var(--gold-100);--warning-solid:var(--gold-500);
--danger-fg:var(--coral-700);--danger-bg:var(--coral-100);--danger-solid:var(--coral-600);
--info-fg:var(--blue-700);--info-bg:var(--blue-100);--info-solid:var(--blue-600);
/* Pipeline stages (Board columns) — "Closed" is neutral, never red */
--stage-saved-fg:var(--ink-700);--stage-saved-bg:var(--paper-200);--stage-saved-dot:var(--ink-400);
--stage-applied-fg:var(--blue-700);--stage-applied-bg:var(--blue-100);--stage-applied-dot:var(--blue-600);
--stage-interview-fg:var(--gold-800);--stage-interview-bg:var(--gold-100);--stage-interview-dot:var(--gold-500);
--stage-offer-fg:var(--mint-700);--stage-offer-bg:var(--mint-100);--stage-offer-dot:var(--mint-600);
--stage-closed-fg:var(--oxford-600);--stage-closed-bg:var(--oxford-100);--stage-closed-dot:var(--oxford-300);
}

--oxford-950:#F3F6FA;--oxford-900:#DDE4F0;--oxford-800:#C4CFE2;--oxford-700:#A9BAD4;--oxford-600:#8A9BB8;--oxford-500:#6683AF;--oxford-300:#4A5A7C;--oxford-200:#33415F;--oxford-100:#1E2638;--oxford-50:#182033;
